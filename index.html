<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="BioLab Assistant - Media Preparation & Genome Search" />
    <title>BioLab Assistant</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc; /* Slate 50 */
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      /* Smooth slide for sidebar */
      .sidebar-enter { transform: translateX(-100%); }
      .sidebar-enter-active { transform: translateX(0); transition: transform 300ms ease-out; }
      .sidebar-exit { transform: translateX(0); }
      .sidebar-exit-active { transform: translateX(-100%); transition: transform 200ms ease-in; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    
    <script type="text/babel">
      const { useState, useEffect, useRef, useMemo, useCallback } = React;

      // ==========================================
      // 1. ICONS
      // ==========================================
      const Icon = ({ children, className, onClick }) => (
        <svg onClick={onClick} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
      );
      const Menu = (p) => <Icon {...p}><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></Icon>;
      const X = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Icon>;
      const Search = (p) => <Icon {...p}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Icon>;
      const Flask = (p) => <Icon {...p}><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/></Icon>;
      const Dna = (p) => <Icon {...p}><path d="M2 15c6.667-6 13.333 0 20-6"/><path d="M9 22c1.798-1.998 2.518-3.995 2.807-5.993"/><path d="M15 2c-1.798 1.998-2.518 3.995-2.807 5.993"/><path d="M17 6l-2.5-2.5"/><path d="M14 8l-1-1"/><path d="M7 18l2.5 2.5"/><path d="M3.5 14.5l.5.5"/><path d="M20 9l.5.5"/><path d="M6.5 12.5l1 1"/><path d="M16.5 10.5l1 1"/><path d="M10 16l1.5 1.5"/></Icon>;
      const Loader = (p) => <Icon {...p}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></Icon>;
      const ExternalLink = (p) => <Icon {...p}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></Icon>;
      const Alert = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></Icon>;
      const Key = (p) => <Icon {...p}><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></Icon>;
      const ChevronRight = (p) => <Icon {...p}><polyline points="9 18 15 12 9 6"/></Icon>;
      const Activity = (p) => <Icon {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></Icon>;
      const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
      const Trash = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></Icon>;
      const Clipboard = (p) => <Icon {...p}><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></Icon>;
      const Download = (p) => <Icon {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></Icon>;
      const Settings = (p) => <Icon {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></Icon>;

      // ==========================================
      // 2. SERVICES
      // ==========================================
      const GeminiService = {
        getKey: () => localStorage.getItem('biolab_api_key'),
        
        async fetch(prompt) {
          const apiKey = this.getKey();
          if (!apiKey) throw new Error("MISSING_KEY");

          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { responseMimeType: "application/json" }
            })
          });

          if (!response.ok) {
            const err = await response.json();
            throw new Error(err.error?.message || "API Error");
          }

          const data = await response.json();
          return JSON.parse(data.candidates[0].content.parts[0].text);
        },

        async analyze(organism) {
          const prompt = `
            Act as a microbiologist. I need data for the organism: "${organism}".
            
            1. MEDIA: Find the standard DSMZ or ATCC media recipe. 
               - Name the specific medium (e.g. "LB Broth", "DSMZ Medium 1").
               - List ingredients for 1 Liter.
               - Provide the DSMZ catalog search term.
            
            2. GENOME: Find NCBI genome details.
               - Scientific Name (exact spelling).
               - Genome Size (approx).
               - Summary (1 sentence).

            Return JSON:
            {
              "media": {
                "name": "string",
                "reference": "string (e.g. DSMZ 1)",
                "ingredients": [{"item": "string", "amount": number, "unit": "g/ml"}],
                "instructions": ["string"],
                "dsmzTerm": "string"
              },
              "genome": {
                "scientificName": "string",
                "size": "string",
                "summary": "string"
              }
            }
          `;
          return this.fetch(prompt);
        }
      };

      // ==========================================
      // 3. COMPONENTS
      // ==========================================

      // --- API Key Modal ---
      const KeyModal = ({ onSave }) => {
        const [k, setK] = useState('');
        return (
          <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
            <div className="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl">
              <div className="flex items-center gap-2 text-indigo-600 mb-4">
                <Key className="w-6 h-6" />
                <h2 className="text-xl font-bold">API Access Required</h2>
              </div>
              <p className="text-slate-600 mb-4 text-sm">
                This app connects directly to Google Gemini. Please enter your API key to proceed.
              </p>
              <input 
                type="password" 
                placeholder="Paste AIza... key here"
                className="w-full p-3 border border-slate-300 rounded-xl mb-4 focus:ring-2 focus:ring-indigo-500 outline-none"
                value={k}
                onChange={e => setK(e.target.value)}
              />
              <button 
                disabled={k.length < 10}
                onClick={() => onSave(k)}
                className="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 disabled:opacity-50 transition-all"
              >
                Start App
              </button>
              <div className="mt-4 text-center">
                 <a href="https://aistudio.google.com/app/apikey" target="_blank" className="text-xs text-indigo-500 hover:underline">Get a free key from Google AI Studio</a>
              </div>
            </div>
          </div>
        );
      };

      // --- Feature: Organism Lab ---
      const OrganismLab = ({ onKeyError }) => {
        const [query, setQuery] = useState('');
        const [data, setData] = useState(null);
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState(null);
        const [liters, setLiters] = useState(1.0);

        const search = async () => {
          if (!query.trim()) return;
          setLoading(true);
          setError(null);
          setData(null);
          try {
            const res = await GeminiService.analyze(query);
            setData(res);
          } catch (e) {
            if (e.message === "MISSING_KEY") {
               onKeyError();
            } else {
               setError("Could not find organism data.");
            }
          } finally {
            setLoading(false);
          }
        };

        return (
          <div className="max-w-3xl mx-auto">
            {/* Search Bar */}
            <div className="bg-white p-2 rounded-2xl shadow-sm border border-slate-200 flex gap-2 mb-8 transition-shadow focus-within:shadow-md focus-within:ring-2 ring-indigo-100">
              <input 
                className="flex-grow p-3 pl-4 outline-none text-slate-800 placeholder-slate-400 bg-transparent"
                placeholder="Enter organism (e.g., E. coli, Yeast)..."
                value={query}
                onChange={e => setQuery(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && search()}
              />
              <button 
                onClick={search}
                disabled={loading || !query}
                className="bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white rounded-xl px-6 font-medium transition-colors flex items-center gap-2"
              >
                {loading ? <Loader className="animate-spin w-5 h-5" /> : 'Analyze'}
              </button>
            </div>

            {/* Error Message */}
            {error && (
              <div className="bg-red-50 text-red-600 p-4 rounded-xl mb-6 flex items-center gap-3 border border-red-100">
                <Alert className="w-5 h-5" />
                {error}
              </div>
            )}

            {/* Results Display */}
            {data && (
              <div className="space-y-6 animate-fade-in">
                
                {/* Media Card */}
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                  <div className="p-5 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                    <div>
                      <h2 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                        <Flask className="w-5 h-5 text-indigo-500" />
                        Growth Media
                      </h2>
                      <p className="text-xs text-slate-500 mt-1 uppercase tracking-wider font-semibold">
                        Ref: {data.media.reference}
                      </p>
                    </div>
                    <a 
                      href={`https://www.dsmz.de/search?tx_indexed_search%5Bsword%5D=${encodeURIComponent(data.media.dsmzTerm)}`}
                      target="_blank"
                      className="text-xs bg-white border border-slate-200 hover:border-indigo-300 text-indigo-600 px-3 py-1.5 rounded-lg font-medium transition-colors flex items-center gap-1"
                    >
                      Verify on DSMZ <ExternalLink className="w-3 h-3" />
                    </a>
                  </div>

                  <div className="p-6">
                    <div className="flex justify-between items-end mb-6">
                      <h3 className="font-semibold text-xl text-indigo-900">{data.media.name}</h3>
                      <div className="text-right">
                        <label className="text-xs font-bold text-slate-400 uppercase">Total Volume</label>
                        <div className="text-2xl font-bold text-indigo-600">{liters} L</div>
                      </div>
                    </div>

                    <input 
                      type="range" min="0.1" max="5.0" step="0.1"
                      value={liters}
                      onChange={e => setLiters(parseFloat(e.target.value))}
                      className="w-full h-2 bg-slate-100 rounded-lg appearance-none cursor-pointer accent-indigo-600 mb-8"
                    />

                    <div className="space-y-3 mb-8">
                      {data.media.ingredients.map((ing, i) => (
                        <div key={i} className="flex justify-between items-center py-2 border-b border-slate-50 last:border-0">
                          <span className="text-slate-700 font-medium">{ing.item}</span>
                          <span className="font-mono text-slate-500 bg-slate-50 px-2 py-1 rounded">
                            {(ing.amount * liters).toFixed(2)} {ing.unit}
                          </span>
                        </div>
                      ))}
                    </div>

                    <div className="bg-slate-50 rounded-xl p-4">
                      <h4 className="text-xs font-bold text-slate-400 uppercase mb-3">Preparation</h4>
                      <ol className="list-decimal list-inside space-y-2 text-sm text-slate-600">
                        {data.media.instructions.map((step, i) => (
                          <li key={i}>{step}</li>
                        ))}
                      </ol>
                    </div>
                  </div>
                </div>

                {/* Genome Card */}
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                   <div className="p-5 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                    <h2 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                      <Dna className="w-5 h-5 text-emerald-500" />
                      Genome Data
                    </h2>
                    <span className="text-xs font-mono text-emerald-600 bg-emerald-50 px-2 py-1 rounded border border-emerald-100">
                      NCBI Available
                    </span>
                  </div>
                  <div className="p-6">
                    <h3 className="text-xl font-serif italic text-slate-800 mb-2">
                      {data.genome.scientificName}
                    </h3>
                    <p className="text-slate-600 text-sm leading-relaxed mb-6">
                      {data.genome.summary}
                    </p>
                    
                    <div className="grid grid-cols-2 gap-4 mb-6">
                      <div className="p-3 bg-slate-50 rounded-xl border border-slate-100">
                        <div className="text-xs text-slate-400 uppercase font-bold mb-1">Genome Size</div>
                        <div className="text-slate-800 font-medium">{data.genome.size}</div>
                      </div>
                      <div className="p-3 bg-slate-50 rounded-xl border border-slate-100">
                         <div className="text-xs text-slate-400 uppercase font-bold mb-1">Source</div>
                        <div className="text-slate-800 font-medium">GenBank / RefSeq</div>
                      </div>
                    </div>

                    <a 
                      href={`https://www.ncbi.nlm.nih.gov/genome/?term=${encodeURIComponent(data.genome.scientificName)}`}
                      target="_blank"
                      className="block w-full text-center py-3 bg-white border border-slate-200 text-emerald-600 hover:border-emerald-500 hover:text-emerald-700 font-medium rounded-xl transition-all"
                    >
                      View Full Genome on NCBI
                    </a>
                  </div>
                </div>

              </div>
            )}
          </div>
        )
      };

      // --- Feature: OD Graph (Updated) ---
      const ODGraph = () => {
        const [activeTab, setActiveTab] = useState('data'); // 'data' | 'settings'

        // Graph Config
        const [config, setConfig] = useState({
          title: "Mean Growth of S. elongatus",
          xLabel: "Time (hours)",
          yLabel: "Mean Absorbance (OD750)",
          autoScale: true,
          xMin: 0, xMax: 150,
          yMin: 0, yMax: 0.5
        });

        // Raw Data
        const [rawData, setRawData] = useState([
          { t: 0, od: 0.0962, rep: 'A' }, { t: 0, od: 0.09675, rep: 'B' }, { t: 0, od: 0.0959, rep: 'C' },
          { t: 24, od: 0.1535, rep: 'A' }, { t: 24, od: 0.1164, rep: 'B' }, { t: 24, od: 0.15995, rep: 'C' },
          { t: 48, od: 0.18975, rep: 'A' }, { t: 48, od: 0.1386, rep: 'B' }, { t: 48, od: 0.1817, rep: 'C' },
          { t: 72, od: 0.1796, rep: 'A' }, { t: 72, od: 0.1293, rep: 'B' }, { t: 72, od: 0.17085, rep: 'C' },
          { t: 96, od: 0.2381, rep: 'A' }, { t: 96, od: 0.1645, rep: 'B' }, { t: 96, od: 0.23215, rep: 'C' },
          { t: 123, od: 0.25545, rep: 'A' }, { t: 123, od: 0.23535, rep: 'B' }, { t: 123, od: 0.272, rep: 'C' }
        ]);
        
        const [showPaste, setShowPaste] = useState(false);
        const [pasteText, setPasteText] = useState('');
        const svgRef = useRef(null);

        // Process Data
        const processedData = useMemo(() => {
          const grouped = {};
          rawData.forEach(d => {
            if (!grouped[d.t]) grouped[d.t] = [];
            grouped[d.t].push(d.od);
          });

          const stats = Object.keys(grouped).map(t => {
            const time = parseFloat(t);
            const values = grouped[t];
            const mean = values.reduce((a, b) => a + b, 0) / values.length;
            const variance = values.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / (values.length > 1 ? values.length - 1 : 1);
            const std = values.length > 1 ? Math.sqrt(variance) : 0;
            return { t: time, mean, std, n: values.length };
          });

          return stats.sort((a, b) => a.t - b.t);
        }, [rawData]);

        // Helpers
        const removePoint = (idx) => {
          const newD = [...rawData];
          newD.splice(idx, 1);
          setRawData(newD);
        };
        const updatePoint = (idx, field, val) => {
          const newD = [...rawData];
          newD[idx][field] = field === 'rep' ? val : parseFloat(val);
          setRawData(newD);
        };
        const addPoint = () => setRawData([...rawData, { t: processedData.length > 0 ? processedData[processedData.length-1].t + 24 : 0, od: 0, rep: 'A' }]);

        const handleBulkImport = () => {
          const lines = pasteText.split(/\r?\n/);
          const newPoints = [];
          lines.forEach(line => {
            const parts = line.trim().split(/[\s,\t]+/);
            if (parts.length >= 2) {
              const t = parseFloat(parts[0]);
              const od = parseFloat(parts[1]);
              const rep = parts[2] || 'A';
              if (!isNaN(t) && !isNaN(od)) newPoints.push({ t, od, rep });
            }
          });
          if (newPoints.length > 0) {
            setRawData(newPoints);
            setShowPaste(false);
          }
        };

        const downloadGraph = () => {
          if (!svgRef.current) return;
          const svgData = new XMLSerializer().serializeToString(svgRef.current);
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");
          const img = new Image();
          const svgRect = svgRef.current.getBoundingClientRect();
          canvas.width = 1200;
          canvas.height = 800;
          img.onload = () => {
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const a = document.createElement("a");
            a.href = canvas.toDataURL("image/png");
            a.download = "growth_curve.png";
            a.click();
          };
          img.src = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svgData)));
        };

        // Render Graph logic
        const width = 800;
        const height = 500;
        const pad = 70;
        const color = "#0d3b66";

        // Calculate Scale ranges
        const xMin = config.autoScale ? 0 : config.xMin;
        const xMax = config.autoScale ? (Math.max(...processedData.map(p => p.t), 0) * 1.1 || 24) : config.xMax;
        const yMin = config.autoScale ? 0 : config.yMin;
        const yMax = config.autoScale ? (Math.max(...processedData.map(p => p.mean + p.std), 0) * 1.1 || 1) : config.yMax;

        const scaleX = (t) => pad + ((t - xMin) / (xMax - xMin)) * (width - 2 * pad);
        const scaleY = (od) => (height - pad) - ((od - yMin) / (yMax - yMin)) * (height - 2 * pad);

        let pathD = "";
        processedData.filter(p => p.t >= xMin && p.t <= xMax).forEach((p, i) => {
           const x = scaleX(p.t);
           const y = scaleY(p.mean);
           pathD += i === 0 ? `M ${x} ${y}` : ` L ${x} ${y}`;
        });

        // Generate Ticks (Simple linear)
        const getTicks = (min, max, count) => {
          const step = (max - min) / count;
          return Array.from({length: count + 1}, (_, i) => min + i * step);
        };
        const xTicks = getTicks(xMin, xMax, 5);
        const yTicks = getTicks(yMin, yMax, 5);

        return (
          <div className="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            {/* Input & Settings Section */}
            <div className="lg:col-span-1 flex flex-col gap-4">
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col max-h-[85vh]">
                
                {/* Tabs */}
                <div className="flex border-b border-slate-100">
                  <button 
                    onClick={() => setActiveTab('data')}
                    className={`flex-1 py-3 text-sm font-bold transition-colors ${activeTab === 'data' ? 'text-indigo-600 bg-indigo-50 border-b-2 border-indigo-600' : 'text-slate-500 hover:text-slate-800'}`}
                  >
                    Data
                  </button>
                  <button 
                    onClick={() => setActiveTab('settings')}
                    className={`flex-1 py-3 text-sm font-bold transition-colors ${activeTab === 'settings' ? 'text-indigo-600 bg-indigo-50 border-b-2 border-indigo-600' : 'text-slate-500 hover:text-slate-800'}`}
                  >
                    Settings
                  </button>
                </div>

                {/* Data Tab */}
                {activeTab === 'data' && (
                  <div className="p-4 flex-1 overflow-hidden flex flex-col">
                    <div className="flex justify-between items-center mb-4">
                      <h3 className="font-bold text-slate-800 text-sm">Measurements</h3>
                      <button onClick={() => setShowPaste(!showPaste)} className="text-xs bg-indigo-50 text-indigo-700 px-2 py-1 rounded hover:bg-indigo-100 flex items-center gap-1">
                        <Clipboard className="w-3 h-3" /> {showPaste ? 'Table' : 'Bulk Paste'}
                      </button>
                    </div>

                    {showPaste ? (
                      <div className="flex-1 flex flex-col animate-fade-in">
                        <p className="text-xs text-slate-500 mb-2">Paste columns: Time, OD, [Rep]. Excel/CSV.</p>
                        <textarea
                          className="flex-1 w-full p-3 text-xs font-mono border border-slate-200 rounded-lg bg-slate-50 mb-3 focus:ring-2 focus:ring-indigo-500 outline-none resize-none"
                          placeholder={`0\t0.096\tA\n0\t0.097\tB...`}
                          value={pasteText}
                          onChange={e => setPasteText(e.target.value)}
                        ></textarea>
                        <button onClick={handleBulkImport} className="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700">Parse Data</button>
                      </div>
                    ) : (
                      <div className="flex-1 overflow-y-auto pr-1">
                        <div className="grid grid-cols-6 gap-2 text-[10px] font-bold text-slate-400 uppercase mb-2">
                           <div className="col-span-2">Time (h)</div>
                           <div className="col-span-2">OD</div>
                           <div className="col-span-1">Rep</div>
                        </div>
                        {rawData.map((p, i) => (
                          <div key={i} className="grid grid-cols-6 gap-2 items-center mb-1">
                            <input type="number" value={p.t} onChange={e => updatePoint(i, 't', e.target.value)} className="col-span-2 p-1 border rounded text-xs" />
                            <input type="number" step="0.01" value={p.od} onChange={e => updatePoint(i, 'od', e.target.value)} className="col-span-2 p-1 border rounded text-xs" />
                             <input type="text" value={p.rep} onChange={e => updatePoint(i, 'rep', e.target.value)} className="col-span-1 p-1 border rounded text-xs text-center" />
                            <button onClick={() => removePoint(i)} className="col-span-1 text-slate-300 hover:text-red-500 flex justify-center"><Trash className="w-3 h-3" /></button>
                          </div>
                        ))}
                        <button onClick={addPoint} className="w-full py-2 border-2 border-dashed border-slate-200 rounded-lg text-slate-400 hover:text-indigo-500 hover:border-indigo-300 flex justify-center items-center gap-2 mt-4 text-xs font-medium transition-colors">
                          <Plus className="w-3 h-3" /> Add Point
                        </button>
                      </div>
                    )}
                  </div>
                )}

                {/* Settings Tab */}
                {activeTab === 'settings' && (
                  <div className="p-5 flex-1 overflow-y-auto space-y-6">
                    {/* Labels */}
                    <div className="space-y-3">
                      <h4 className="text-xs font-bold text-slate-400 uppercase">Graph Labels</h4>
                      <div>
                        <label className="text-xs text-slate-500 block mb-1">Chart Title</label>
                        <input value={config.title} onChange={e => setConfig({...config, title: e.target.value})} className="w-full p-2 border border-slate-200 rounded text-sm outline-none focus:border-indigo-500" />
                      </div>
                      <div>
                        <label className="text-xs text-slate-500 block mb-1">X-Axis Label</label>
                        <input value={config.xLabel} onChange={e => setConfig({...config, xLabel: e.target.value})} className="w-full p-2 border border-slate-200 rounded text-sm outline-none focus:border-indigo-500" />
                      </div>
                      <div>
                        <label className="text-xs text-slate-500 block mb-1">Y-Axis Label</label>
                        <input value={config.yLabel} onChange={e => setConfig({...config, yLabel: e.target.value})} className="w-full p-2 border border-slate-200 rounded text-sm outline-none focus:border-indigo-500" />
                      </div>
                    </div>

                    {/* Scaling */}
                    <div className="space-y-3">
                      <div className="flex justify-between items-center">
                         <h4 className="text-xs font-bold text-slate-400 uppercase">Axis Scaling</h4>
                         <label className="flex items-center gap-2 cursor-pointer">
                           <input type="checkbox" checked={config.autoScale} onChange={e => setConfig({...config, autoScale: e.target.checked})} className="accent-indigo-600 w-4 h-4" />
                           <span className="text-sm font-medium text-slate-700">Auto Scale</span>
                         </label>
                      </div>

                      {!config.autoScale && (
                        <div className="grid grid-cols-2 gap-4 p-3 bg-slate-50 rounded-xl border border-slate-100">
                          <div>
                            <span className="text-xs font-bold text-indigo-500 block mb-2">X-Axis (Time)</span>
                            <div className="flex gap-2">
                              <input type="number" value={config.xMin} onChange={e => setConfig({...config, xMin: parseFloat(e.target.value)})} className="w-full p-1 border rounded text-xs" placeholder="Min" />
                              <input type="number" value={config.xMax} onChange={e => setConfig({...config, xMax: parseFloat(e.target.value)})} className="w-full p-1 border rounded text-xs" placeholder="Max" />
                            </div>
                          </div>
                           <div>
                            <span className="text-xs font-bold text-indigo-500 block mb-2">Y-Axis (OD)</span>
                            <div className="flex gap-2">
                              <input type="number" value={config.yMin} onChange={e => setConfig({...config, yMin: parseFloat(e.target.value)})} className="w-full p-1 border rounded text-xs" placeholder="Min" />
                              <input type="number" value={config.yMax} onChange={e => setConfig({...config, yMax: parseFloat(e.target.value)})} className="w-full p-1 border rounded text-xs" placeholder="Max" />
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            </div>

            {/* Graph Section */}
            <div className="lg:col-span-2">
              <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 h-full flex flex-col">
                 <div className="flex justify-between items-center mb-6">
                    <h2 className="font-bold text-xl text-slate-800">Growth Curve Analysis</h2>
                    <button 
                      onClick={downloadGraph}
                      className="text-sm bg-slate-800 text-white px-4 py-2 rounded-lg hover:bg-slate-700 flex items-center gap-2 font-medium"
                    >
                      <Download className="w-4 h-4" /> Download PNG
                    </button>
                 </div>
                 
                 <div className="w-full bg-white border border-slate-100 rounded-xl p-4 overflow-hidden relative flex-grow flex items-center justify-center">
                   {/* SVG Container */}
                   <svg 
                      ref={svgRef}
                      viewBox={`0 0 ${width} ${height}`} 
                      className="w-full h-auto max-h-[500px]"
                      style={{fontFamily: 'Inter, sans-serif', backgroundColor: 'white'}}
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      {/* Background */}
                      <rect width={width} height={height} fill="white" />

                      {/* Title */}
                      <text x={width/2} y={30} textAnchor="middle" fontSize="22" fontWeight="bold" fill="#333">{config.title}</text>
                      
                      {/* X Axis Label */}
                      <text x={width/2} y={height-5} textAnchor="middle" fontSize="18" fontWeight="bold" fill="#333">{config.xLabel}</text>
                      
                      {/* Y Axis Label - Rotated */}
                      <text x={15} y={height/2} textAnchor="middle" transform={`rotate(-90, 15, ${height/2})`} fontSize="18" fontWeight="bold" fill="#333">{config.yLabel}</text>

                      {/* Axes Lines */}
                      <line x1={pad} y1={height-pad} x2={width-pad} y2={height-pad} stroke="black" strokeWidth="2" />
                      <line x1={pad} y1={pad} x2={pad} y2={height-pad} stroke="black" strokeWidth="2" />

                      {/* Ticks X */}
                      {xTicks.map(val => {
                         const x = scaleX(val);
                         if(x > width-pad + 1 || x < pad - 1) return null;
                         return (
                           <g key={'tx'+val}>
                             <line x1={x} y1={height-pad} x2={x} y2={height-pad+5} stroke="black" strokeWidth="1.5" />
                             <text x={x} y={height-pad+20} textAnchor="middle" fontSize="12" fill="#333">{val % 1 === 0 ? val : val.toFixed(1)}</text>
                           </g>
                         )
                      })}

                      {/* Ticks Y */}
                      {yTicks.map(val => {
                         const y = scaleY(val);
                         if(y < pad - 1 || y > height - pad + 1) return null;
                         return (
                           <g key={'ty'+val}>
                             <line x1={pad-5} y1={y} x2={pad} y2={y} stroke="black" strokeWidth="1.5" />
                             <text x={pad-8} y={y+4} textAnchor="end" fontSize="12" fill="#333">{val % 1 === 0 ? val : val.toFixed(2)}</text>
                           </g>
                         )
                      })}

                      {/* Data Group */}
                      <g>
                         {/* Connecting Line */}
                         <path d={pathD} fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
                         
                         {/* Points & Error Bars */}
                         {processedData.filter(p => p.t >= xMin && p.t <= xMax).map((p, i) => {
                           const x = scaleX(p.t);
                           const y = scaleY(p.mean);
                           const yTop = scaleY(p.mean + p.std);
                           const yBot = scaleY(p.mean - p.std);

                           // Skip if out of Y bounds
                           if (y < pad || y > height - pad) return null;

                           return (
                             <g key={i}>
                               {/* Error Bar Vertical */}
                               {p.std > 0 && (
                                 <>
                                  <line x1={x} y1={Math.max(yBot, pad)} x2={x} y2={Math.min(yTop, height-pad)} stroke="black" strokeWidth="1.5" />
                                  {/* Caps */}
                                  {yBot >= pad && yBot <= height-pad && <line x1={x-5} y1={yBot} x2={x+5} y2={yBot} stroke="black" strokeWidth="1.5" />}
                                  {yTop <= height-pad && yTop >= pad && <line x1={x-5} y1={yTop} x2={x+5} y2={yTop} stroke="black" strokeWidth="1.5" />}
                                 </>
                               )}
                               {/* Point */}
                               <circle 
                                 cx={x} cy={y} r="5" 
                                 fill={color} 
                                 stroke="black" strokeWidth="1.5"
                               />
                             </g>
                           );
                         })}
                      </g>
                   </svg>
                 </div>

                 {/* Stats Summary */}
                 <div className="mt-4 grid grid-cols-2 md:grid-cols-4 gap-4">
                   {processedData.slice(0,4).map(d => (
                     <div key={d.t} className="bg-slate-50 p-3 rounded-lg border border-slate-100 text-center">
                       <div className="text-xs font-bold text-slate-400">T = {d.t}h</div>
                       <div className="font-mono text-indigo-700 font-bold">{d.mean.toFixed(3)}</div>
                       <div className="text-[10px] text-slate-500">± {d.std.toFixed(3)}</div>
                     </div>
                   ))}
                   {processedData.length > 4 && (
                     <div className="bg-slate-50 p-3 rounded-lg border border-slate-100 flex items-center justify-center text-xs text-slate-400">
                       + {processedData.length - 4} more
                     </div>
                   )}
                 </div>
              </div>
            </div>

          </div>
        );
      };

      // --- Main Shell & Sidebar ---
      const App = () => {
        const [key, setKey] = useState(localStorage.getItem('biolab_api_key'));
        const [view, setView] = useState('organism-lab');
        const [menuOpen, setMenuOpen] = useState(false);

        const handleSaveKey = (k) => {
          localStorage.setItem('biolab_api_key', k);
          setKey(k);
        };

        const handleResetKey = () => {
          localStorage.removeItem('biolab_api_key');
          setKey(null);
        };

        // If no key, show modal
        if (!key) return <KeyModal onSave={handleSaveKey} />;

        // Menu Items configuration
        const menuItems = [
          { id: 'organism-lab', label: 'Organism Lab', icon: Flask },
          { id: 'od-graph', label: 'OD Growth Curve', icon: Activity },
          // Future features will be added here
        ];

        return (
          <div className="min-h-screen relative flex flex-col">
            
            {/* Header */}
            <header className="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-slate-200 h-16 px-4 flex items-center justify-between shadow-sm">
              <div className="flex items-center gap-3">
                <button 
                  onClick={() => setMenuOpen(true)}
                  className="p-2 -ml-2 text-slate-600 hover:bg-slate-100 rounded-lg transition-colors"
                >
                  <Menu className="w-6 h-6" />
                </button>
                <h1 className="text-lg font-bold text-slate-900 tracking-tight flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-indigo-500"></span>
                  BioLab Assistant
                </h1>
              </div>
              <button 
                onClick={handleResetKey}
                className="text-xs text-slate-400 hover:text-red-500 font-medium px-2 py-1"
              >
                Reset Key
              </button>
            </header>

            {/* Sidebar Overlay */}
            {menuOpen && (
              <div className="fixed inset-0 z-40 flex">
                {/* Backdrop */}
                <div 
                  className="fixed inset-0 bg-black/20 backdrop-blur-sm transition-opacity" 
                  onClick={() => setMenuOpen(false)}
                ></div>

                {/* Drawer */}
                <div className="relative bg-white w-64 h-full shadow-2xl flex flex-col border-r border-slate-100 animate-[slideIn_0.2s_ease-out]">
                  <div className="h-16 flex items-center justify-between px-4 border-b border-slate-100">
                    <span className="font-bold text-slate-800">Menu</span>
                    <button onClick={() => setMenuOpen(false)} className="p-1 text-slate-400 hover:text-slate-600">
                      <X className="w-5 h-5" />
                    </button>
                  </div>
                  <nav className="p-2 space-y-1">
                    {menuItems.map(item => {
                      const isActive = view === item.id;
                      const ItemIcon = item.icon;
                      return (
                        <button
                          key={item.id}
                          onClick={() => { setView(item.id); setMenuOpen(false); }}
                          className={`w-full flex items-center gap-3 px-3 py-3 rounded-lg text-sm font-medium transition-colors ${
                            isActive 
                            ? 'bg-indigo-50 text-indigo-700' 
                            : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'
                          }`}
                        >
                          <ItemIcon className={`w-5 h-5 ${isActive ? 'text-indigo-600' : 'text-slate-400'}`} />
                          {item.label}
                          {isActive && <ChevronRight className="w-4 h-4 ml-auto opacity-50" />}
                        </button>
                      );
                    })}
                    {/* Placeholder for future features */}
                    <div className="pt-4 mt-4 border-t border-slate-100 px-3">
                      <p className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Coming Soon</p>
                      <div className="text-sm text-slate-400 py-2 opacity-50 cursor-not-allowed flex items-center gap-3">
                         <Icon className="w-5 h-5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></Icon>
                         Inventory
                      </div>
                    </div>
                  </nav>
                </div>
              </div>
            )}

            {/* Main Content */}
            <main className="flex-grow p-4 md:p-8">
              {view === 'organism-lab' && <OrganismLab onKeyError={() => setKey(null)} />}
              {view === 'od-graph' && <ODGraph />}
            </main>

          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
