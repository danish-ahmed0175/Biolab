<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#4f46e5" />
    <title>BioLab Assistant</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (UMD) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
        overscroll-behavior-y: none; 
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- MAIN APPLICATION SCRIPT -->
    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // ----------------------------------------------------------------------
      // 1. ICONS
      // ----------------------------------------------------------------------
      const IconWrapper = ({ children, className }) => (
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          {children}
        </svg>
      );

      const Search = (p) => <IconWrapper {...p}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></IconWrapper>;
      const FlaskConical = (p) => <IconWrapper {...p}><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/></IconWrapper>;
      const Dna = (p) => <IconWrapper {...p}><path d="M2 15c6.667-6 13.333 0 20-6"/><path d="M9 22c1.798-1.998 2.518-3.995 2.807-5.993"/><path d="M15 2c-1.798 1.998-2.518 3.995-2.807 5.993"/><path d="M17 6l-2.5-2.5"/><path d="M14 8l-1-1"/><path d="M7 18l2.5 2.5"/><path d="M3.5 14.5l.5.5"/><path d="M20 9l.5.5"/><path d="M6.5 12.5l1 1"/><path d="M16.5 10.5l1 1"/><path d="M10 16l1.5 1.5"/></IconWrapper>;
      const Loader2 = (p) => <IconWrapper {...p}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></IconWrapper>;
      const AlertCircle = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></IconWrapper>;
      const CheckCircle2 = (p) => <IconWrapper {...p}><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></IconWrapper>;
      const ArrowRight = (p) => <IconWrapper {...p}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></IconWrapper>;
      const Zap = (p) => <IconWrapper {...p}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></IconWrapper>;
      const KeyIcon = (p) => <IconWrapper {...p}><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></IconWrapper>;
      const Trash2 = (p) => <IconWrapper {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></IconWrapper>;
      const ExternalLink = (p) => <IconWrapper {...p}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></IconWrapper>;

      // ----------------------------------------------------------------------
      // 2. SERVICE (REAL GEMINI API VIA FETCH)
      // ----------------------------------------------------------------------
      const GeminiService = {
        
        getKey: () => localStorage.getItem('gemini_api_key'),

        generate: async (prompt, isJson = true) => {
          const apiKey = GeminiService.getKey();
          if (!apiKey) throw new Error("API Key not found");

          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
          
          const payload = {
            contents: [{ parts: [{ text: prompt }] }]
          };

          if (isJson) {
            payload.generationConfig = { responseMimeType: "application/json" };
          }

          const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            const err = await response.json();
            throw new Error(err.error?.message || "Failed to fetch from Gemini");
          }

          const data = await response.json();
          const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
          return isJson ? JSON.parse(text) : text;
        },

        getMediaRecipe: async (organism) => {
          // Strict prompt to act as a retrieval agent for DSMZ data
          const prompt = `
            You are a precise laboratory database assistant. 
            Retrieve the STANDARD, OFFICIAL growth media recipe for the organism "${organism}".
            
            Source priority: 
            1. DSMZ (German Collection of Microorganisms)
            2. ATCC (American Type Culture Collection)
            3. ISO Standards
            
            Do NOT invent a recipe. Find the specific Catalog Number (e.g., "DSMZ Medium 1", "LB Broth").
            
            Return ONLY a valid JSON object with this structure:
            {
              "mediaName": "string (e.g. 'LB Broth', 'Nutrient Agar')",
              "reference": "string (e.g. 'DSMZ Medium 1', 'ATCC Medium 3')",
              "description": "string (Brief usage description)",
              "ingredients": [{"name": "string", "amount": number (for 1 Liter), "unit": "string (g, ml)"}],
              "instructions": ["string (Step by step prep instructions for 1 Liter)"],
              "dsmzSearchTerm": "string (Scientific name to search on DSMZ site)"
            }
            Ensure amounts are normalized for 1 Liter of media.
          `;
          
          const data = await GeminiService.generate(prompt, true);
          
          // Add direct link to DSMZ search for verification
          const searchTerm = data.dsmzSearchTerm || organism;
          return {
            ...data,
            dsmzLink: `https://www.dsmz.de/search?tx_indexed_search%5Bsword%5D=${encodeURIComponent(searchTerm)}`
          };
        },

        getGenomeInfo: async (organism) => {
          const prompt = `
            Provide genome information for the organism "${organism}".
            Return ONLY a valid JSON object with this structure:
            {
              "organismName": "string (Scientific Name)",
              "summary": "string (Brief 2-sentence summary of the genome significance)",
              "genomeSize": "string (e.g. 4.6 Mb, 12 Mb)",
              "isAvailable": boolean (True if widely available on NCBI),
              "ncbiSearchTerm": "string (The EXACT full scientific name to use in NCBI search. Example: 'Saccharomyces cerevisiae' NOT 'Yeast'. Example: 'Escherichia coli' NOT 'E. coli')"
            }
          `;
          const data = await GeminiService.generate(prompt, true);
          
          const searchTerm = data.ncbiSearchTerm || data.organismName || organism;
          return {
            ...data,
            ncbiLink: `https://www.ncbi.nlm.nih.gov/genome/?term=${encodeURIComponent(searchTerm)}`
          };
        }
      };

      // ----------------------------------------------------------------------
      // 3. COMPONENT: API KEY MODAL
      // ----------------------------------------------------------------------
      const ApiKeyModal = ({ onSave }) => {
        const [inputKey, setInputKey] = useState('');

        return (
          <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
              <div className="p-6 bg-indigo-600 text-white">
                <div className="flex items-center gap-3 mb-2">
                  <KeyIcon className="w-8 h-8" />
                  <h2 className="text-xl font-bold">Setup Required</h2>
                </div>
                <p className="text-indigo-100 text-sm">To use the AI features, please provide your Google Gemini API Key.</p>
              </div>
              <div className="p-6">
                <label className="block text-sm font-medium text-slate-700 mb-2">API Key (starts with AIza...)</label>
                <input 
                  type="password" 
                  value={inputKey}
                  onChange={(e) => setInputKey(e.target.value)}
                  placeholder="Paste your API Key here"
                  className="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none mb-4"
                />
                <div className="text-xs text-slate-500 mb-6">
                  Don't have one? <a href="https://aistudio.google.com/app/apikey" target="_blank" className="text-indigo-600 hover:underline">Get a free key here</a>.
                  The key is stored locally in your browser.
                </div>
                <button 
                  onClick={() => {
                    if(inputKey.trim().length > 10) onSave(inputKey.trim());
                  }}
                  disabled={inputKey.length < 10}
                  className="w-full bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-bold py-3 rounded-xl transition-all"
                >
                  Save & Continue
                </button>
              </div>
            </div>
          </div>
        );
      };

      // ----------------------------------------------------------------------
      // 4. MAIN COMPONENT (ORGANISM LAB)
      // ----------------------------------------------------------------------
      const OrganismLab = ({ hasKey }) => {
        const [organism, setOrganism] = useState('');
        const [volume, setVolume] = useState(1.0);
        
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState(null);
        
        const [recipe, setRecipe] = useState(null);
        const [genome, setGenome] = useState(null);

        const handleSearch = async () => {
          if (!organism.trim()) return;
          if (!hasKey) {
            setError("API Key is missing. Please reload to enter it.");
            return;
          }

          setLoading(true);
          setError(null);
          setRecipe(null);
          setGenome(null);

          try {
            // Fetch data from Real Gemini API
            const [recipeData, genomeData] = await Promise.all([
              GeminiService.getMediaRecipe(organism),
              GeminiService.getGenomeInfo(organism)
            ]);
            setRecipe(recipeData);
            setGenome(genomeData);
          } catch (err) {
            console.error(err);
            setError(err.message || "Failed to analyze organism. Check your API key or try again.");
            
            // If error is 403 or 400 key related, might want to clear key, but let's just show error
            if (err.message.includes("API key") || err.message.includes("400")) {
              setError("Invalid API Key or Request. Please clear key and try again.");
            }
          } finally {
            setLoading(false);
          }
        };

        return (
          <div className="max-w-4xl mx-auto p-4 space-y-8 pb-24">
            
            {/* Search Section */}
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
              <h2 className="text-2xl font-bold text-slate-800 mb-4 flex items-center gap-2">
                <FlaskConical className="w-6 h-6 text-indigo-600" />
                Organism Search
              </h2>
              <p className="text-slate-500 mb-6">
                Enter an organism name (e.g., <i>E. coli</i>, <i>S. cerevisiae</i>) to retrieve standard media protocols (DSMZ/ATCC) and genome availability.
              </p>
              
              <div className="flex flex-col sm:flex-row gap-4">
                <div className="relative flex-grow">
                  <input
                    type="text"
                    value={organism}
                    onChange={(e) => setOrganism(e.target.value)}
                    placeholder="Enter organism name..."
                    className="w-full pl-4 pr-10 py-3 rounded-xl border border-slate-700 bg-slate-900 text-white placeholder-slate-400 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none"
                    onKeyDown={(e) => e.key === 'Enter' && handleSearch()}
                  />
                  <Search className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5" />
                </div>
                <button
                  onClick={handleSearch}
                  disabled={loading || !organism}
                  className="bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-300 text-white font-medium px-8 py-3 rounded-xl transition-colors flex items-center justify-center gap-2 shadow-lg shadow-indigo-200"
                >
                  {loading ? <Loader2 className="animate-spin w-5 h-5" /> : 'Analyze'}
                </button>
              </div>
              
              {error && (
                <div className="mt-4 p-4 bg-red-50 text-red-700 rounded-xl flex items-center gap-3">
                  <AlertCircle className="w-5 h-5 flex-shrink-0" />
                  {error}
                </div>
              )}
            </div>

            {/* Results Grid */}
            {(recipe || genome) && (
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                
                {/* Media Recipe Card */}
                {recipe && (
                  <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                    <div className="p-6 bg-gradient-to-r from-indigo-50 to-blue-50 border-b border-indigo-100">
                      <div className="flex items-center justify-between mb-2">
                        <h3 className="text-lg font-bold text-indigo-900 flex items-center gap-2">
                          <FlaskConical className="w-5 h-5" />
                          Media Protocol
                        </h3>
                        <span className="px-3 py-1 bg-blue-100 text-blue-700 text-xs font-bold rounded-full border border-blue-200">
                          {recipe.reference || "STANDARD"}
                        </span>
                      </div>
                      <h4 className="text-xl font-semibold text-indigo-800">{recipe.mediaName}</h4>
                      <p className="text-sm text-indigo-600/80 mt-1">{recipe.description}</p>
                      
                      {recipe.dsmzLink && (
                        <a 
                          href={recipe.dsmzLink} 
                          target="_blank" 
                          rel="noopener noreferrer" 
                          className="inline-flex items-center gap-1 text-xs font-semibold text-indigo-600 hover:text-indigo-800 mt-3 hover:underline"
                        >
                          Verify on DSMZ <ExternalLink className="w-3 h-3" />
                        </a>
                      )}
                    </div>

                    <div className="p-6 flex-grow flex flex-col">
                      {/* Volume Calculator */}
                      <div className="mb-6 p-4 bg-slate-50 rounded-xl border border-slate-100">
                        <label className="block text-sm font-medium text-slate-700 mb-2">
                          Target Volume: <span className="text-indigo-600 font-bold">{volume} Liters</span>
                        </label>
                        <input
                          type="range"
                          min="0.1"
                          max="5.0"
                          step="0.1"
                          value={volume}
                          onChange={(e) => setVolume(parseFloat(e.target.value))}
                          className="w-full h-2 bg-indigo-200 rounded-lg appearance-none cursor-pointer accent-indigo-600"
                        />
                        <div className="flex justify-between text-xs text-slate-400 mt-1">
                          <span>0.1 L</span>
                          <span>5.0 L</span>
                        </div>
                      </div>

                      <div className="space-y-4">
                        <h5 className="font-semibold text-slate-800 border-b pb-2">Ingredients (per {volume} L)</h5>
                        <ul className="space-y-3">
                          {recipe.ingredients.map((ing, idx) => (
                            <li key={idx} className="flex justify-between items-center text-slate-700 text-sm">
                              <span>{ing.name}</span>
                              <span className="font-mono font-medium bg-slate-100 px-2 py-1 rounded text-slate-900">
                                {(ing.amount * volume).toFixed(2)} {ing.unit}
                              </span>
                            </li>
                          ))}
                        </ul>
                      </div>

                      <div className="mt-6 pt-6 border-t border-slate-100">
                        <h5 className="font-semibold text-slate-800 mb-2">Instructions</h5>
                        <ol className="list-decimal list-inside space-y-2 text-sm text-slate-600">
                          {recipe.instructions.map((inst, idx) => (
                            <li key={idx}>{inst}</li>
                          ))}
                        </ol>
                      </div>
                    </div>
                  </div>
                )}

                {/* Genome Info Card */}
                {genome && (
                  <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                     <div className="p-6 bg-gradient-to-r from-emerald-50 to-teal-50 border-b border-emerald-100">
                      <div className="flex items-center justify-between mb-2">
                        <h3 className="text-lg font-bold text-emerald-900 flex items-center gap-2">
                          <Dna className="w-5 h-5" />
                          Genomics (NCBI)
                        </h3>
                        {genome.isAvailable ? (
                          <span className="px-3 py-1 bg-emerald-100 text-emerald-700 text-xs font-bold rounded-full border border-emerald-200 flex items-center gap-1">
                            <CheckCircle2 className="w-3 h-3" /> FOUND
                          </span>
                        ) : (
                           <span className="px-3 py-1 bg-amber-100 text-amber-700 text-xs font-bold rounded-full border border-amber-200 flex items-center gap-1">
                            <AlertCircle className="w-3 h-3" /> CHECK SOURCE
                          </span>
                        )}
                      </div>
                      <h4 className="text-xl font-semibold text-emerald-800">{genome.organismName}</h4>
                    </div>

                    <div className="p-6 flex-grow">
                      <div className="prose prose-sm prose-slate text-slate-600 mb-6">
                        <p>{genome.summary}</p>
                      </div>
                      
                      {genome.genomeSize && (
                         <div className="mb-6 flex items-center gap-3 p-3 bg-slate-50 rounded-lg border border-slate-100">
                           <div className="p-2 bg-white rounded shadow-sm border border-slate-200">
                              <Dna className="w-5 h-5 text-emerald-500" />
                           </div>
                           <div>
                             <div className="text-xs text-slate-400 uppercase font-semibold">Genome Size</div>
                             <div className="font-medium text-slate-800">{genome.genomeSize}</div>
                           </div>
                         </div>
                      )}

                      {genome.ncbiLink && (
                        <a 
                          href={genome.ncbiLink} 
                          target="_blank" 
                          rel="noopener noreferrer"
                          className="group flex items-center justify-between w-full p-4 bg-white border border-slate-200 hover:border-emerald-400 hover:shadow-md rounded-xl transition-all duration-200"
                        >
                          <span className="font-medium text-emerald-700 group-hover:text-emerald-600">View on NCBI Database</span>
                          <ArrowRight className="w-5 h-5 text-slate-400 group-hover:text-emerald-500 transform group-hover:translate-x-1 transition-all" />
                        </a>
                      )}
                    </div>
                  </div>
                )}

              </div>
            )}
          </div>
        );
      };

      // ----------------------------------------------------------------------
      // 5. APP COMPONENT
      // ----------------------------------------------------------------------
      const App = () => {
        const [apiKey, setApiKey] = useState(null);
        const [showKeyModal, setShowKeyModal] = useState(false);

        useEffect(() => {
          const stored = localStorage.getItem('gemini_api_key');
          if (stored) {
            setApiKey(stored);
          } else {
            setShowKeyModal(true);
          }
        }, []);

        const saveKey = (key) => {
          localStorage.setItem('gemini_api_key', key);
          setApiKey(key);
          setShowKeyModal(false);
        };

        const clearKey = () => {
          if(confirm("Remove API Key?")) {
            localStorage.removeItem('gemini_api_key');
            setApiKey(null);
            setShowKeyModal(true);
            window.location.reload();
          }
        };

        return (
          <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900 font-sans">
            {showKeyModal && <ApiKeyModal onSave={saveKey} />}

            {/* Header */}
            <header className="bg-white border-b border-slate-200 sticky top-0 z-40">
              <div className="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <div className="bg-indigo-600 text-white p-2 rounded-lg">
                    <FlaskConical className="w-6 h-6" />
                  </div>
                  <h1 className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600">
                    BioLab Assistant
                  </h1>
                </div>
                {apiKey && (
                  <button onClick={clearKey} className="text-slate-400 hover:text-red-500 transition-colors" title="Clear API Key">
                    <Trash2 className="w-5 h-5" />
                  </button>
                )}
              </div>
            </header>

            {/* Main Content */}
            <main className="flex-grow py-8 px-4">
              <OrganismLab hasKey={!!apiKey} />
            </main>

            {/* Footer */}
            <footer className="border-t border-slate-200 bg-white py-6 mt-auto">
              <div className="max-w-4xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4 text-sm text-slate-500">
                <div className="flex items-center gap-2">
                  <Zap className="w-4 h-4 text-indigo-500 fill-indigo-500" />
                  <span>Powered by Gemini 2.5 Flash</span>
                </div>
                <p>© {new Date().getFullYear()} BioLab Assistant. For research purposes only.</p>
              </div>
            </footer>
          </div>
        );
      };

      // ----------------------------------------------------------------------
      // 6. RENDER
      // ----------------------------------------------------------------------
      const rootElement = document.getElementById('root');
      const root = ReactDOM.createRoot(rootElement);
      root.render(
        <React.StrictMode>
          <App />
        </React.StrictMode>
      );
    </script>
  </body>
</html>
